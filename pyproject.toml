[project]
name = "gridscalper"
version = "0.1.0"
description = "Trade-driven adaptive grid trading with risk-aware RL on A-share tick data"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "wandb>=0.17",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
